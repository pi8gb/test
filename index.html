<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finger Tracker</title>

    <!-- MediaPipe -->
    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
        crossorigin="anonymous">
    </script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 15px 0 5px;
        }

        #status {
            margin: 10px;
            padding: 10px;
            background: #222;
            border-radius: 8px;
        }

        button {
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin: 10px;
        }

        #container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        #coordinates {
            margin: 15px auto;
            padding: 15px;
            width: 90%;
            max-width: 650px;
            box-sizing: border-box;

            background: #222;
            border-radius: 10px;

            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>🖐️ Finger Tracker</h1>

<div id="status">Loading MediaPipe...</div>

<button id="startButton">
    Start Camera
</button>

<div id="container">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

</div>

<div id="coordinates">
Waiting...
</div>


<script type="module">

// Get MediaPipe from the global module
import {
    FilesetResolver,
    HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";


const status =
    document.getElementById("status");

const button =
    document.getElementById("startButton");

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const coordinates =
    document.getElementById("coordinates");


let handLandmarker = null;
let running = false;


// ==========================================
// INITIALIZE MEDIAPIPE
// ==========================================

async function initialize() {

    try {

        status.textContent =
            "Loading MediaPipe...";


        const vision =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
            );


        status.textContent =
            "Loading hand model...";


        handLandmarker =
            await HandLandmarker.createFromOptions(
                vision,
                {

                    baseOptions: {

                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

                    },

                    runningMode: "VIDEO",

                    numHands: 2

                }
            );


        status.textContent =
            "Ready! Press Start Camera.";

        button.disabled = false;


    } catch (error) {

        status.textContent =
            "MediaPipe ERROR";

        coordinates.textContent =
            error.message;

        console.error(error);

    }
}


// ==========================================
// CAMERA
// ==========================================

async function startCamera() {

    try {

        status.textContent =
            "Requesting camera permission...";


        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Camera API unavailable. Make sure you are using HTTPS or localhost."
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject = stream;


        await video.play();


        // Wait until dimensions are available

        if (video.videoWidth === 0) {

            await new Promise(resolve => {

                video.addEventListener(
                    "loadedmetadata",
                    resolve,
                    { once: true }
                );

            });

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        running = true;


        status.textContent =
            "Camera running! Show your hand.";


        button.style.display = "none";


        detect();


    } catch (error) {

        status.textContent =
            "CAMERA ERROR";

        coordinates.textContent =
            error.name +
            "\n\n" +
            error.message;

        console.error(error);

    }
}


// ==========================================
// HAND DETECTION
// ==========================================

function detect() {

    if (!running) {
        return;
    }


    const results =
        handLandmarker.detectForVideo(
            video,
            performance.now()
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (results.landmarks.length === 0) {

        status.textContent =
            "Camera running — no hand detected.";

        coordinates.textContent =
            "Put your hand in front of the camera.";

    }

    else {

        status.textContent =
            results.landmarks.length +
            " hand(s) detected";


        let text = "";


        results.landmarks.forEach(
            (landmarks, handNumber) => {

                text +=
                    "HAND " +
                    (handNumber + 1) +
                    "\n\n";


                // Finger tips
                const fingertips = {

                    Thumb: landmarks[4],

                    Index: landmarks[8],

                    Middle: landmarks[12],

                    Ring: landmarks[16],

                    Pinky: landmarks[20]

                };


                for (
                    const [name, point]
                    of Object.entries(fingertips)
                ) {

                    text +=
                        name.padEnd(7) +
                        " X: " +
                        point.x.toFixed(3) +
                        "  Y: " +
                        point.y.toFixed(3) +
                        "  Z: " +
                        point.z.toFixed(3) +
                        "\n";

                }


                text += "\n";


                // =================================
                // DRAW ALL 21 POINTS
                // =================================

                for (let i = 0; i < landmarks.length; i++) {

                    const point =
                        landmarks[i];


                    const x =
                        point.x *
                        canvas.width;

                    const y =
                        point.y *
                        canvas.height;


                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        i === 8 ? 10 : 5,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }


                // =================================
                // DRAW CONNECTIONS
                // =================================

                const connections = [

                    [0,1], [1,2], [2,3], [3,4],

                    [0,5], [5,6], [6,7], [7,8],

                    [0,9], [9,10], [10,11], [11,12],

                    [0,13], [13,14], [14,15], [15,16],

                    [0,17], [17,18], [18,19], [19,20],

                    [5,9],
                    [9,13],
                    [13,17]

                ];


                ctx.lineWidth = 3;


                for (const [a,b] of connections) {

                    const x1 =
                        landmarks[a].x *
                        canvas.width;

                    const y1 =
                        landmarks[a].y *
                        canvas.height;

                    const x2 =
                        landmarks[b].x *
                        canvas.width;

                    const y2 =
                        landmarks[b].y *
                        canvas.height;


                    ctx.beginPath();

                    ctx.moveTo(x1,y1);

                    ctx.lineTo(x2,y2);

                    ctx.stroke();

                }

            }
        );


        coordinates.textContent =
            text;

    }


    requestAnimationFrame(detect);

}


// ==========================================
// BUTTON
// ==========================================

button.disabled = true;


button.addEventListener(
    "click",
    startCamera
);


// Start loading immediately
initialize();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediaPipe Face + Hand Tracker</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
}

#status {
    margin: 10px;
    padding: 10px;
    background: #222;
    border-radius: 10px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    margin: 10px;
}

#container {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: auto;
}

video {
    width: 100%;
    display: block;
    border-radius: 10px;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
}

#info {
    width: 90%;
    max-width: 700px;
    margin: 15px auto;
    padding: 15px;
    box-sizing: border-box;

    background: #222;
    border-radius: 10px;

    text-align: left;
    font-family: monospace;

    white-space: pre-wrap;
}

</style>
</head>


<body>

<h1>Face + Hand Tracker</h1>

<div id="status">
    Loading MediaPipe...
</div>

<button id="startButton">
    Start Camera
</button>

<div id="container">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

</div>

<div id="info">
Waiting...
</div>


<script type="module">

import {
    FilesetResolver,
    FaceLandmarker,
    GestureRecognizer
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";


const status =
    document.getElementById("status");

const button =
    document.getElementById("startButton");

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const info =
    document.getElementById("info");


let faceLandmarker;
let gestureRecognizer;

let running = false;


// ======================================================
// INITIALIZE
// ======================================================

async function initialize() {

    try {

        status.textContent =
            "Loading MediaPipe...";


        const vision =
            await FilesetResolver.forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

            );


        // ==============================================
        // FACE MODEL
        // ==============================================

        status.textContent =
            "Loading face tracker...";


        faceLandmarker =
            await FaceLandmarker.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

                    },

                    runningMode: "VIDEO",

                    numFaces: 1,

                    outputFaceBlendshapes: true

                }

            );


        // ==============================================
        // HAND GESTURE MODEL
        // ==============================================

        status.textContent =
            "Loading hand gesture tracker...";


        gestureRecognizer =
            await GestureRecognizer.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task"

                    },

                    runningMode: "VIDEO",

                    numHands: 2

                }

            );


        status.textContent =
            "Ready! Press Start Camera.";

        button.disabled = false;


    } catch (error) {

        status.textContent =
            "ERROR";

        info.textContent =
            error.message;

        console.error(error);

    }

}


// ======================================================
// CAMERA
// ======================================================

async function startCamera() {

    try {

        status.textContent =
            "Requesting camera permission...";


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API unavailable. Use HTTPS or localhost."
            );

        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject = stream;

        await video.play();


        if (video.videoWidth === 0) {

            await new Promise(resolve => {

                video.addEventListener(
                    "loadedmetadata",
                    resolve,
                    { once: true }
                );

            });

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        running = true;

        button.style.display = "none";

        status.textContent =
            "Tracking!";


        detect();


    } catch (error) {

        status.textContent =
            "CAMERA ERROR";

        info.textContent =
            error.name +
            "\n\n" +
            error.message;

        console.error(error);

    }

}


// ======================================================
// DETECTION LOOP
// ======================================================

function detect() {

    if (!running) {
        return;
    }


    const now =
        performance.now();


    // ==============================================
    // FACE
    // ==============================================

    const faceResults =
        faceLandmarker.detectForVideo(
            video,
            now
        );


    // ==============================================
    // HANDS / GESTURES
    // ==============================================

    const handResults =
        gestureRecognizer.recognizeForVideo(
            video,
            now
        );


    // Clear canvas

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let output = "";


    // =================================================
    // FACE INFORMATION
    // =================================================

    if (
        faceResults.faceLandmarks &&
        faceResults.faceLandmarks.length > 0
    ) {

        const face =
            faceResults.faceLandmarks[0];


        output +=
            "========== FACE ==========\n\n";


        // Important face landmarks
        const parts = {

            "Nose": face[1],

            "Left eye": face[33],

            "Right eye": face[263],

            "Left mouth": face[61],

            "Right mouth": face[291],

            "Chin": face[152],

            "Forehead": face[10]

        };


        for (
            const [name, point]
            of Object.entries(parts)
        ) {

            output +=
                name.padEnd(13) +

                " X: " +
                point.x.toFixed(3) +

                "  Y: " +
                point.y.toFixed(3) +

                "  Z: " +
                point.z.toFixed(3) +

                "\n";

        }


        output += "\n";


        // =============================================
        // DRAW FACE LANDMARKS
        // =============================================

        for (
            const point of face
        ) {

            const x =
                point.x *
                canvas.width;

            const y =
                point.y *
                canvas.height;


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                2,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        // =============================================
        // LABEL IMPORTANT PARTS
        // =============================================

        for (
            const [name, point]
            of Object.entries(parts)
        ) {

            const x =
                point.x *
                canvas.width;

            const y =
                point.y *
                canvas.height;


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                7,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        // =============================================
        // EXPRESSIONS
        // =============================================

        if (
            faceResults.faceBlendshapes &&
            faceResults.faceBlendshapes.length > 0
        ) {

            const categories =
                faceResults.faceBlendshapes[0].categories;


            let strongest = null;


            for (
                const category of categories
            ) {

                if (
                    !strongest ||
                    category.score >
                    strongest.score
                ) {

                    strongest = category;

                }

            }


            if (strongest) {

                output +=
                    "Expression signal:\n" +

                    strongest.categoryName +

                    " (" +
                    (strongest.score * 100)
                    .toFixed(1) +
                    "%)\n\n";

            }


            // Useful expression signals

            const expressionNames = [

                "mouthSmileLeft",
                "mouthSmileRight",

                "mouthFrownLeft",
                "mouthFrownRight",

                "jawOpen",

                "eyeBlinkLeft",
                "eyeBlinkRight",

                "browInnerUp",

                "browOuterUpLeft",
                "browOuterUpRight"

            ];


            output +=
                "Face signals:\n";


            for (
                const name of expressionNames
            ) {

                const found =
                    categories.find(
                        x =>
                        x.categoryName === name
                    );


                if (found) {

                    output +=
                        name.padEnd(22) +

                        (
                            found.score * 100
                        ).toFixed(1) +

                        "%\n";

                }

            }

        }

    } else {

        output +=
            "========== FACE ==========\n\n" +
            "No face detected.\n\n";

    }


    // =================================================
    // HANDS
    // =================================================

    if (
        handResults.landmarks &&
        handResults.landmarks.length > 0
    ) {

        output +=
            "\n========== HANDS ==========\n\n";


        handResults.landmarks.forEach(
            (hand, index) => {


            output +=
                "Hand " +
                (index + 1) +
                "\n";


            // Gesture

            if (
                handResults.gestures &&
                handResults.gestures[index] &&
                handResults.gestures[index].length
            ) {

                const gesture =
                    handResults.gestures[index][0];


                output +=
                    "Gesture: " +
                    gesture.categoryName +
                    " (" +
                    (
                        gesture.score * 100
                    ).toFixed(1) +
                    "%)\n";

            }


            // Finger tips

            const fingers = {

                Thumb: hand[4],

                Index: hand[8],

                Middle: hand[12],

                Ring: hand[16],

                Pinky: hand[20]

            };


            for (
                const [name, point]
                of Object.entries(fingers)
            ) {

                output +=
                    name.padEnd(8) +

                    " X: " +
                    point.x.toFixed(3) +

                    " Y: " +
                    point.y.toFixed(3) +

                    "\n";

            }


            output += "\n";


            // =========================================
            // DRAW HAND POINTS
            // =========================================

            for (
                const point of hand
            ) {

                const x =
                    point.x *
                    canvas.width;

                const y =
                    point.y *
                    canvas.height;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        });


    } else {

        output +=
            "\n========== HANDS ==========\n\n" +
            "No hands detected.\n";

    }


    info.textContent =
        output;


    requestAnimationFrame(detect);

}


// ======================================================
// BUTTON
// ======================================================

button.disabled = true;


button.addEventListener(
    "click",
    startCamera
);


// Start loading

initialize();

</script>

</body>
</html>
